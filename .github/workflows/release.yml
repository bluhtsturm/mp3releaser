# Baut das AppImage, prueft es und veroeffentlicht es als GitHub-Release.
#
# Ausgeloest durch ein Versions-Tag, das zu releaser.__version__ passt:
#
#     git tag v0.22.1
#     git push origin v0.22.1
#
# Von Hand gestartet (Actions -> Release -> Run workflow) entsteht nur ein
# Artefakt zum Herunterladen, kein Release - zum Ausprobieren vor dem Tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    name: AppImage bauen und pruefen
    # Dieselbe Grundlage wie der lokal gepruefte Bau: Ubuntu 24.04 mit dem
    # System-Python 3.12, fuer das PyGObject und GTK 4 als Pakete vorliegen.
    # Das AppImage braucht dadurch glibc 2.38 oder neuer. Auf einem aelteren
    # Ubuntu gebaut, laege eine aeltere GLib im Buendel - die vertraegt sich
    # nicht mit dem neueren GTK des Wirts, und die Oberflaeche fiele aus.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      APPIMAGETOOL_VERSION: "1.9.1"
      APPIMAGETOOL_SHA256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
    outputs:
      version: ${{ steps.dist.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Systempakete
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv python3-gi gir1.2-gtk-4.0 gir1.2-webkit-6.0 \
            xvfb xauth ffmpeg

      - name: Python-Umgebung
        # --system-site-packages: PyGObject kommt aus dem Systempaket. Nur
        # dann kann PyInstaller die Oberflaeche mitbuendeln.
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install \
            mutagen pyinstaller fastapi uvicorn httpx pytest pyflakes
          .venv/bin/python -c "from releaser.frontends import gtkui; \
            assert gtkui.is_available(), gtkui.GTK_ERROR"

      - name: Version pruefen
        # Das Tag muss zur Version im Code passen - sonst hiesse die Datei
        # anders, als das Programm von sich selbst sagt.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(.venv/bin/python -c "import releaser; print(releaser.__version__)")
          project=$(.venv/bin/python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "$project" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, __version__ $version und pyproject $project passen nicht zusammen"
            exit 1
          fi

      - name: Quelltext pruefen
        # WebKitGTK startet seine Prozesse sonst in einer Sandbox, die Ubuntu
        # 24.04 fuer normale Benutzer sperrt. Geladen wird hier nur die eigene
        # Seite vom eigenen Testserver.
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
        run: |
          .venv/bin/python -m pyflakes releaser tools tests packaging
          .venv/bin/python -m pytest tests -q -p no:cacheprovider -rs

      - name: appimagetool
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  $HOME/.local/bin/appimagetool" | sha256sum -c -
          chmod +x "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Bauen
        # build.sh endet auch ohne appimagetool erfolgreich (mit einem
        # lauffaehigen AppDir) - hier muss aber das AppImage entstehen.
        run: |
          PYTHON=.venv/bin/python ./packaging/build.sh
          if [ ! -f build/mp3releaser-x86_64.AppImage ]; then
            echo "::error::kein AppImage entstanden - appimagetool gefunden?"
            exit 1
          fi

      - name: Buendel und Oberflaeche pruefen
        # Jetzt laufen auch die Tests, die ein gebautes Buendel brauchen -
        # darunter der Start der Oberflaeche aus dem AppDir.
        run: .venv/bin/python -m pytest tests/test_packaging.py -q -p no:cacheprovider -rs

      - name: AppImage pruefen
        # Ohne Python, ohne PATH - so, wie es beim Nutzer ankommt
        run: |
          app="$PWD/build/mp3releaser-x86_64.AppImage"
          env -i APPIMAGE_EXTRACT_AND_RUN=1 PATH=/nonexistent HOME=/tmp "$app" --version
          env -i APPIMAGE_EXTRACT_AND_RUN=1 PATH=/nonexistent HOME=/tmp "$app" metrics

      - name: Umbenennen und Pruefsumme
        id: dist
        run: |
          version=$(.venv/bin/python -c "import releaser; print(releaser.__version__)")
          name="mp3releaser-${version}-x86_64.AppImage"
          mkdir -p dist
          cp build/mp3releaser-x86_64.AppImage "dist/$name"
          (cd dist && sha256sum "$name" > SHA256SUMS && cat SHA256SUMS)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: mp3releaser-${{ steps.dist.outputs.version }}-x86_64
          path: dist/
          if-no-files-found: error

  release:
    name: Release anlegen
    needs: appimage
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mp3releaser-${{ needs.appimage.outputs.version }}-x86_64
          path: dist

      - name: Veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.appimage.outputs.version }}
        run: |
          cat > notes.md <<EOF
          ## mp3releaser ${VERSION}

          **Deutsch** – eine Datei, ohne Installation, ohne Python:

              chmod +x mp3releaser-${VERSION}-x86_64.AppImage
              ./mp3releaser-${VERSION}-x86_64.AppImage              # grafische Oberfläche
              ./mp3releaser-${VERSION}-x86_64.AppImage --help       # Kommandozeile
              sha256sum -c SHA256SUMS

          Voraussetzung: Linux x86_64 mit glibc 2.38 oder neuer (Ubuntu 24.04,
          Linux Mint 22, Debian 13, Fedora 39 und neuer). Die Oberfläche nutzt
          das GTK 4 des Systems, die Kommandozeile läuft auch ohne. Ohne FUSE:
          \`--appimage-extract-and-run\`. Änderungen: [CHANGE.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGE.md).

          **English** – a single file, no installation, no Python. Requires
          Linux x86_64 with glibc 2.38 or newer; the graphical interface uses
          the system's GTK 4, the command line works without it. See the
          [README](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/README.en.md).
          EOF
          files=(dist/*.AppImage dist/SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Erneuter Lauf fuer dasselbe Tag: Dateien ersetzen statt scheitern
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "mp3releaser ${VERSION}" --notes-file notes.md
          fi
